# QAAI — the whole stack.
#
#   cd deploy && cp .env.example ../.env   # then fill in the generated secrets
#   docker compose up -d
#
# See deploy/README.md for the secret-generation one-liner and verification.
#
# ── No secret has a default here, on purpose ─────────────────────────────────
# Every credential is written `${VAR:?...}`, which makes compose refuse to start
# when the variable is unset *or empty*. A default would be copied out of this
# file into a real deployment and shared by every install that ever ran it —
# which for VAULT_MASTER_KEY means every customer sharing one encryption key.
# The failure mode of a missing value is a clear error before anything boots;
# the failure mode of a default is a silent, unrecoverable compromise.

name: qaai

# Service-to-service URLs use compose hostnames, which is why they override the
# localhost values in .env.example rather than inheriting them.
x-app-env: &app-env
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}

  # Quoted: the `:?` error messages contain a colon-and-space, which YAML would
  # otherwise read as the start of a nested mapping.
  DATABASE_URL: 'postgresql://qaai:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD — see deploy/.env.example}@postgres:5432/qaai?schema=public'
  REDIS_URL: redis://redis:6379

  API_PUBLIC_URL: http://api:4000
  WEB_PUBLIC_URL: ${WEB_PUBLIC_URL:-http://localhost:3000}
  DEMO_PUBLIC_URL: http://demo:5050

  SESSION_SECRET: '${SESSION_SECRET:?set SESSION_SECRET — generate with: openssl rand -base64 48}'
  VAULT_MASTER_KEY: '${VAULT_MASTER_KEY:?set VAULT_MASTER_KEY — generate with: openssl rand -base64 32}'

  # Artifacts go to MinIO (S3-compatible) by default.
  ARTIFACTS_LOCAL: ${ARTIFACTS_LOCAL:-false}
  S3_ENDPOINT: http://minio:9000
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_BUCKET: ${S3_BUCKET:-qaai-artifacts}
  S3_ACCESS_KEY_ID: '${MINIO_ROOT_USER:?set MINIO_ROOT_USER — see deploy/.env.example}'
  S3_SECRET_ACCESS_KEY: '${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD — see deploy/.env.example}'
  S3_FORCE_PATH_STYLE: "true"

  # Optional. Absent means the LLM features degrade rather than crash.
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  QAAI_MODEL_CHEAP: ${QAAI_MODEL_CHEAP:-claude-haiku-4-5}
  QAAI_MODEL_STRONG: ${QAAI_MODEL_STRONG:-claude-opus-5}
  QAAI_MONTHLY_TOKEN_BUDGET: ${QAAI_MONTHLY_TOKEN_BUDGET:-0}

  # Billing. Blank means "not purchasable online", which is the right default
  # for a self-hosted install. Without these lines a compose deployment could
  # set STRIPE_SECRET_KEY in its .env and watch nothing happen: the variable
  # never reached the container.
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  STRIPE_PRICE_TEAM: ${STRIPE_PRICE_TEAM:-}
  STRIPE_PRICE_BUSINESS: ${STRIPE_PRICE_BUSINESS:-}

  # GitHub. The App gives check runs on the merge box; the plain webhook secret
  # covers the personal-access-token path. Same story as above — the code reads
  # all four and compose forwarded none of them.
  GITHUB_APP_ID: ${GITHUB_APP_ID:-}
  GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
  GITHUB_APP_PRIVATE_KEY_ENC: ${GITHUB_APP_PRIVATE_KEY_ENC:-}
  GITHUB_APP_WEBHOOK_SECRET: ${GITHUB_APP_WEBHOOK_SECRET:-}
  GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}

  # Retention deletes artifacts for real only when this says so, everywhere else
  # it is a dry run. It belongs in compose precisely because it is the switch an
  # operator most needs to be able to find.
  QAAI_RETENTION_APPLY: ${QAAI_RETENTION_APPLY:-false}

  # SENTRY_DSN was forwarded here and read by nothing — no Sentry SDK exists in
  # any package.json — so it has been removed rather than left as a passthrough
  # that quietly discards what an operator sets.

# api, web, demo and the migration job all run the same image.
x-app-build: &app-build
  context: .
  dockerfile: Dockerfile
  target: runtime
  args:
    # Baked into the cockpit's JS bundle at build time, so it must be the URL a
    # browser can reach — not the compose hostname.
    NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}

services:
  # ─── Datastores ────────────────────────────────────────────────────────────
  #
  # Every long-running service below carries a MEMORY limit, sized for a small
  # single-node install (a handful of orgs, one worker). Two deliberate choices:
  #
  #   - Memory is limited because it fails badly without a bound: one leaking
  #     process invites the kernel OOM killer, which picks its own victim —
  #     historically the process whose death hurts most, i.e. Postgres. A
  #     per-service limit turns "the box died" into "one container restarted",
  #     which `restart: unless-stopped` then handles.
  #   - CPU is deliberately NOT limited. CPU contention degrades gracefully
  #     through the scheduler, while a throttled worker turns real browser
  #     timeouts into flaky test verdicts — the product failing at its one job —
  #     and a throttled healthcheck reads as an outage that isn't one.
  #
  # The one-shot jobs (migrate, minio-init, seed) carry no limit on purpose: an
  # OOM-killed migration is a half-applied migration, strictly worse than a
  # briefly greedy one.
  #
  # None of these limits has been exercised under load (no docker on the
  # authoring machine — see deploy/README.md's ledger); the numbers are budgets,
  # not measurements. If a service is OOM-killed in practice, raise its limit
  # and treat the old number as the measurement this machine could not take.
  postgres:
    # Pinned to a specific minor, not `17-alpine`: a datastore that can jump
    # minors on an unrelated `docker compose pull` is a behaviour change nobody
    # scheduled. Bump deliberately, with a fresh backup taken first.
    image: postgres:17.2-alpine
    restart: unless-stopped
    # Postgres at compose scale runs comfortably here — default shared_buffers
    # is 128MB and the API's connection count is small.
    mem_limit: 512m
    environment:
      POSTGRES_USER: qaai
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD — generate with: openssl rand -hex 24}'
      POSTGRES_DB: qaai
    volumes:
      - qaai-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qaai -d qaai"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    # Not published to the host. Uncomment the mapping in
    # docker-compose.override.yml.example if you need psql from outside.

  redis:
    # Same reasoning as postgres: pin the minor, bump deliberately.
    image: redis:7.4-alpine
    restart: unless-stopped
    # Redis holds BullMQ queues and worker heartbeats — small data, but it must
    # never evict: an evicted key is a silently lost job. So the bound is a
    # container-level backstop and there is deliberately NO redis-side
    # maxmemory/eviction policy. If this limit is ever hit, the fix is finding
    # what grew, not letting Redis pick keys to drop.
    mem_limit: 256m
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - qaai-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    # Still `latest`, and here is the honest reason: MinIO publishes only dated
    # RELEASE.* tags (plus `latest`) — there is no stable minor line to pin the
    # way postgres/redis above are pinned — and the machine this was written on
    # has no docker with which to ask the registry which dated tag is current.
    # Naming one from memory risks pinning to a tag that does not exist, which
    # fails later and more confusingly than `latest` does. Before production,
    # pin by DIGEST instead, which is stronger than any tag:
    #
    #   docker pull minio/minio:latest
    #   docker image inspect --format '{{index .RepoDigests 0}}' minio/minio:latest
    #   # replace the line below with the printed value:
    #   # image: minio/minio@sha256:<digest>
    #
    # Give minio/mc in minio-init the same treatment.
    image: minio/minio:latest
    restart: unless-stopped
    # Artifact PUT/GET at one-worker scale; MinIO idles far below this.
    mem_limit: 512m
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: '${MINIO_ROOT_USER:?set MINIO_ROOT_USER — see deploy/.env.example}'
      MINIO_ROOT_PASSWORD: '${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD — min 8 chars, generate with: openssl rand -hex 24}'
    volumes:
      - qaai-miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # One-shot: create the artifacts bucket, then exit.
  minio-init:
    # `latest` for the same reason as minio above; pin by digest when you can
    # ask a registry. No mem_limit: one-shot (see the datastores header).
    image: minio/mc:latest
    depends_on:
      minio: { condition: service_healthy }
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
      S3_BUCKET: ${S3_BUCKET:-qaai-artifacts}
    # Credentials arrive through the environment rather than the command line so
    # they do not show up in `docker ps`, `docker inspect` or the compose logs.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" > /dev/null &&
        mc mb --ignore-existing "local/$$S3_BUCKET" &&
        echo "bucket $$S3_BUCKET ready"
    restart: on-failure

  # ─── Schema migration ──────────────────────────────────────────────────────
  #
  # A dedicated one-shot job rather than a step inside the API's command, for
  # two reasons: scaling the API to two replicas would otherwise run two
  # concurrent `migrate deploy`s against the same database, and a migration
  # failure here stops the rollout instead of leaving a half-migrated API up.
  #
  # The entrypoint's `migrate` verb runs from /app/apps/api. That matters:
  # schema.prisma declares `datasource db` with no url, so the connection string
  # comes from apps/api/prisma.config.ts, which Prisma resolves relative to the
  # working directory. Running it from the repo root — as the previous compose
  # file did — fails with "The datasource.url property is required in your
  # Prisma config file". Verified against the live database; see deploy/README.md.
  migrate:
    build: *app-build
    image: qaai/app:local
    command: ["migrate"]
    # Only the database URL, deliberately. Prisma Migrate reads its connection
    # string from apps/api/prisma.config.ts and never loads apps/api/src/env.ts,
    # so handing this job the vault key or the session secret would widen the
    # blast radius of a compromised migration for no functional gain.
    environment:
      DATABASE_URL: 'postgresql://qaai:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD — see deploy/.env.example}@postgres:5432/qaai?schema=public'
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  # ─── Application services ──────────────────────────────────────────────────
  api:
    build: *app-build
    image: qaai/app:local
    restart: unless-stopped
    command: ["api"]
    environment:
      <<: *app-env
      API_PORT: "4000"
    # Node RSS for the API sits well under half of this; the headroom is for
    # artifact streaming and the scrape-time metric aggregates.
    mem_limit: 512m
    ports:
      - "${API_BIND:-127.0.0.1}:4000:4000"
    volumes:
      - qaai-artifacts:/app/.artifacts
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    # node:22-slim carries no curl or wget, so the check uses node's own fetch
    # rather than adding a package to the image just to poll a port.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  worker:
    build:
      <<: *app-build
      # The only service that needs browsers. This target is `FROM runtime`, so
      # it shares every layer with the image above and adds one on top.
      target: runtime-browsers
    image: qaai/app-browsers:local
    restart: unless-stopped
    command: ["worker"]
    environment:
      <<: *app-env
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
      # Nightly database backups (worker-only — the API never reads these).
      # Blank means no backup runs and the worker's log says so at warn once a
      # day. NOTE the honest caveat, kept in deploy/README.md's unproven list:
      # this image does not currently ship pg_dump, so an in-container backup
      # fails loudly with an install hint until the postgres-17 client tools
      # are added to the runtime layer. Point QAAI_BACKUP_DIR at a bind mount
      # on storage that does not share a disk with the postgres volume.
      QAAI_BACKUP_DIR: ${QAAI_BACKUP_DIR:-}
      QAAI_BACKUP_KEEP: ${QAAI_BACKUP_KEEP:-7}
    # Budget ~500MB per WORKER_CONCURRENCY slot (each slot drives a Chromium),
    # PLUS /dev/shm below — tmpfs pages count against this same cgroup. At the
    # default 4 slots: 4 × 500MB + 1GB shm ≈ 3GB, so 4g leaves headroom.
    # mem_limit cannot do arithmetic, so this is an env knob rather than a
    # constant: raise it in step with WORKER_CONCURRENCY, or shrink both on a
    # small box (WORKER_CONCURRENCY=2 fits in 2g).
    mem_limit: ${WORKER_MEM_LIMIT:-4g}
    # Chromium needs more than Docker's default 64MB of /dev/shm; below roughly
    # 256MB it crashes on content-heavy pages with no useful error.
    shm_size: 1gb
    volumes:
      - qaai-artifacts:/app/.artifacts
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  web:
    build: *app-build
    image: qaai/app:local
    restart: unless-stopped
    command: ["web"]
    # The cockpit is a rendering layer: it talks to the API over HTTP and owns
    # no credentials. It deliberately does NOT inherit *app-env — a Next server
    # with the vault key in its environment is one SSR bug away from printing it.
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
      WEB_PUBLIC_URL: ${WEB_PUBLIC_URL:-http://localhost:3000}
    # A Next server rendering a cockpit for a handful of concurrent humans.
    mem_limit: 512m
    ports:
      - "${WEB_BIND:-127.0.0.1}:3000:3000"
    depends_on:
      api: { condition: service_healthy }

  # The bundled demo store — the app QAAI tests during onboarding. No database,
  # no secrets; it is a target, not part of the control plane.
  demo:
    build: *app-build
    image: qaai/app:local
    restart: unless-stopped
    command: ["demo"]
    environment:
      NODE_ENV: production
      DEMO_PORT: "5050"
      DEMO_SMTP_PORT: "5051"
      DEMO_PLANTED_BUG: ${DEMO_PLANTED_BUG:-true}
    # A toy store with in-memory state; the smallest budget here.
    mem_limit: 256m
    ports:
      - "${DEMO_BIND:-127.0.0.1}:5050:5050"
      - "${DEMO_BIND:-127.0.0.1}:5051:5051"

volumes:
  qaai-pgdata:
  qaai-redisdata:
  qaai-miniodata:
  # Only used when ARTIFACTS_LOCAL=true; the API and worker must agree on the
  # path, so both mount it either way.
  qaai-artifacts:
