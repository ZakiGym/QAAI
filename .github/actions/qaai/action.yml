# Reusable GitHub Action (§6).
#
# Runs a QAAI suite in the repo's own CI and fails the job when a test fails or
# a quality gate blocks — the CLI's exit code does the work, this is just the
# thin wrapper that surfaces JUnit to the Checks tab.
#
# WHY THE PACKAGE NAME IS SCOPED AND PINNED
#
# This step used to run `npx --yes qaai run …`. The unscoped name `qaai` on the
# public npm registry belongs to somebody else — an unrelated OpenAPI-to-Jest
# generator, published at 1.0.0, which ships its own `qaai` binary. So the line
# above resolved to a stranger's package, `--yes` installed it without asking,
# and it was handed control of a step that had just exported the customer's
# QAAI_API_KEY into its environment. The job then failed confusingly, because
# that package has never heard of `run --env`.
#
# A scope cannot be squatted the same way: `@qaai/*` can only be published by
# the owner of the `qaai` scope. Pinning the version on top means a compromised
# later release cannot be pulled in silently by a workflow that has not changed.
# If the pinned version is not published, this fails with a plain 404 naming the
# package — loud and correct, which is what the old line was not.

# THE COVERAGE GATE IS ITS SIBLING, NOT ANOTHER MODE OF THIS ACTION
#
# ../qaai-coverage fails a pull request when too much of the application's
# SOURCE-DECLARED surface has no test, and writes the named list of untested
# routes, endpoints, forms and auth surfaces into the job summary. It is a
# separate action on purpose, and the reasoning is worth keeping here because
# the obvious instinct is to add two inputs to this file instead:
#
#   - `environment-id` above is `required: true`, which is the one guarantee
#     this action makes: it cannot be configured into running nothing. A
#     coverage mode needs no environment, so adding it means making that input
#     optional and branching on which mode the caller meant.
#   - The lifecycles do not match. A coverage check is a read of an analysis the
#     platform already holds — no browser, no deploy, no minutes of waiting — so
#     it belongs in a cheap job that runs on every pull request alongside lint,
#     not behind a suite.
#   - A composite action cannot cleanly delegate to its neighbour either: a
#     relative `uses: ./.github/actions/...` inside a composite action resolves
#     against the WORKFLOW's checkout rather than the action's own directory, so
#     a delegating step would work while both are vendored into the customer's
#     repository and break the day they consume this by its published name.
#
# Both files pin `cli-version`, and for the reason above that pin is a security
# property rather than a preference. MOVE THEM TOGETHER: a customer running two
# versions of the CLI in one pipeline gets two vocabularies for "covered".
#
# Usage of both together is documented in docs/ci.md and docs/coverage-gate.md.

name: QAAI
description: Run a QAAI test suite and block the build on failures
inputs:
  api-key:
    description: QAAI API key (store as a repository secret)
    required: true
  environment-id:
    description: The environment to run against
    required: true
  api-url:
    description: QAAI API base URL
    required: false
    default: http://localhost:4000
  suite:
    # Quoted, and it has to be: an unquoted plain scalar cannot contain a
    # colon followed by a space. Without the quotes this line ends the mapping
    # early and the whole file fails to load with "mapping values are not
    # allowed here" — which is how the action looked to every workflow that
    # tried to use it, since the runner parses this file before it runs a step.
    description: 'Run only this suite (default: the whole project)'
    required: false
  junit-path:
    description: Where to write JUnit XML
    required: false
    default: qaai-results.xml
  cli-version:
    description: >-
      Version of @qaai/cli to run. Pinned by default so a workflow that has not
      changed cannot start executing different code; override to upgrade.
    required: false
    default: 0.1.0
runs:
  using: composite
  steps:
    - name: Run QAAI
      shell: bash
      env:
        QAAI_API_KEY: ${{ inputs.api-key }}
        QAAI_API_URL: ${{ inputs.api-url }}
      run: |
        npx --yes "@qaai/cli@${{ inputs.cli-version }}" run \
          --env "${{ inputs.environment-id }}" \
          ${{ inputs.suite && format('--suite {0}', inputs.suite) || '' }} \
          --commit "${{ github.sha }}" \
          --junit "${{ inputs.junit-path }}"

    # Surfaces per-test results in the Checks tab even when the run passes.
    - name: Publish results
      if: always()
      uses: mikepenz/action-junit-report@v4
      with:
        report_paths: ${{ inputs.junit-path }}
        fail_on_failure: false
